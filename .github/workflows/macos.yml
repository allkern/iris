name: macOS CI

on:
  push:
  pull_request:

jobs:
  macos-universal-build:
    runs-on: macos-latest

    env:
      # Both slices must get an identical seed and iteration count: they have to
      # generate the same cases in the same order for the recording to line up.
      # The count is per pass, and the harness walks seven of them.
      JIT_DIFF_SEED: '0x123456789abcdef'
      JIT_DIFF_ITERATIONS: '4000'

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        optional_components: com.lunarg.vulkan.volk
        install_runtime: true
        cache: true
        stripdown: true

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install mbedTLS codegen deps
      run: pip install -r deps/mbedtls/scripts/basic.requirements.txt

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIRIS_BUILD_TESTS=ON
        cmake --build build
        sudo cmake --install build
        mkdir -p ./build/dist
        cp -R ./build/iris.app ./build/dist

    - uses: actions/upload-artifact@v7
      with:
        name: iris-latest-macos-universal
        path: ./build/dist

    # Deliberately after the artifact upload: a codegen regression should turn
    # the job red without also costing us the build.
    #
    # This is the one check here that needs no second slice. A fastmem pass and
    # its slow-path twin share a seed group, so they run the same cases, and the
    # only difference between them is whether the bus fastmem tables are
    # populated - which decides whether a load or store goes through the inline
    # sequence or calls out to the bus. Fastmem is meant to be transparent, so
    # two recordings of the same cases on the same machine have to come out byte
    # for byte identical.
    #
    # It runs before the cross-backend comparison because it localises a fault
    # to one path on one machine, which an arm64-vs-x86_64 diff cannot do. It
    # also covers the path shipped builds actually run: the harness this
    # replaces left the tables zeroed, so the inline load/store sequence and the
    # constant-address folding path were emitted on every build and never once
    # executed.
    - name: Check fastmem against the slow path
      run: |
        # +e on purpose. Actions runs these as `bash -e` and `set -uo pipefail`
        # does not clear it, so without this a core that exits non-zero kills
        # the step before any of the reporting below gets to run - which is
        # precisely the run where the reporting is worth having.
        set +e -uo pipefail

        BIN=./build/tests/jit_diff/iris-jit-diff

        native=$(uname -m)

        summary() { cat >> "$GITHUB_STEP_SUMMARY"; }

        status=0

        echo "## Fastmem transparency" | summary
        echo | summary
        echo "Recorded twice on the $native slice, fastmem off then on." | summary
        echo | summary

        for pass in ee-single ee-block; do
          echo "::group::$pass with fastmem off and on"

          for variant in "$pass" "$pass-fastmem"; do
            arch -"$native" "$BIN" \
              --seed "$JIT_DIFF_SEED" \
              --iterations "$JIT_DIFF_ITERATIONS" \
              --label "$native" \
              --pass "$variant" \
              --record "jit-$variant.rec" 2>&1 | tee "out-$variant.txt"
            rc=${PIPESTATUS[0]}

            # Record mode reports no divergences - there is nothing to compare
            # against yet - so a non-zero status here is a fatal error.
            if [ "$rc" != 0 ]; then
              echo "::error::$variant logged a fatal error"
              status=1
            fi
          done

          echo "::endgroup::"

          if cmp "jit-$pass.rec" "jit-$pass-fastmem.rec"; then
            echo "- \`$pass\`: identical with fastmem off and on" | summary
          else
            echo "::error::fastmem changes what $pass computes"
            echo "- \`$pass\`: **differs** once fastmem is on" | summary
            status=1
          fi
        done

        if [ "$status" != 0 ]; then
          {
            echo
            echo "A difference here is in the inline load/store sequence or the"
            echo "constant-folded pointer path, on this one machine - not a"
            echo "disagreement between backends."
          } | summary
        fi

        exit $status

    # The x86_64 recompiler is the reference - it is the one that is known good.
    # It runs a fixed set of cases and records what it produced; the arm64
    # recompiler then replays the same cases and compares. Both slices come out
    # of the same universal binary, so this is the same source built by the same
    # compiler, differing only in asmjit backend. Any disagreement is a codegen
    # bug in one of them.
    - name: Run EE/IOP recompiler differential test
      run: |
        # See the note on +e above. A divergence makes the compare exit 1, and
        # under errexit that would end the step right there - before the status
        # is classified, before the summary is written, and before the artifact
        # names the cases. The exit code is handled explicitly below instead.
        set +e -uo pipefail

        BIN=./build/tests/jit_diff/iris-jit-diff

        echo "slices in the universal binary: $(lipo -archs "$BIN")"

        native=$(uname -m)

        can_run() { arch -"$1" /usr/bin/true 2>/dev/null; }

        summary() { cat >> "$GITHUB_STEP_SUMMARY"; }

        echo "## EE/IOP recompiler differential test" | summary
        echo | summary
        echo "seed \`$JIT_DIFF_SEED\`, $JIT_DIFF_ITERATIONS iterations per core" | summary
        echo | summary

        status=0

        # The x86_64 slice needs Rosetta on an arm64 runner. Probe rather than
        # assume: a missing translator is not a build failure, it only costs us
        # the cross-backend comparison for that run.
        if can_run x86_64 && can_run arm64; then
          echo "::group::record (x86_64)"
          arch -x86_64 "$BIN" \
            --seed "$JIT_DIFF_SEED" \
            --iterations "$JIT_DIFF_ITERATIONS" \
            --label x86_64 \
            --record jit-x86_64.rec 2>&1 | tee out-record.txt
          record_rc=${PIPESTATUS[0]}
          echo "::endgroup::"

          echo "::group::compare (arm64)"
          arch -arm64 "$BIN" \
            --seed "$JIT_DIFF_SEED" \
            --iterations "$JIT_DIFF_ITERATIONS" \
            --label arm64 \
            --other-label x86_64 \
            --compare jit-x86_64.rec \
            --signatures-out sig-arm64.txt 2>&1 | tee out-compare.txt
          compare_rc=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$record_rc" -ge 2 ]; then
            echo "::error::the x86_64 recompiler logged a fatal error"
            status=1
          fi

          if [ "$compare_rc" -ge 2 ]; then
            echo "::error::the arm64 recompiler logged a fatal error"
            status=1
          fi

          # In this mode every divergence is a backend disagreement, so unlike
          # the interpreter fallback below there is no known-noise to tolerate.
          if [ "$compare_rc" = 1 ]; then
            echo "::error::the arm64 recompiler disagrees with the x86_64 recompiler"
            status=1
          fi

          if [ "$status" = 0 ]; then
            echo "The arm64 recompiler agreed with the x86_64 recompiler on every case." | summary
          else
            {
              echo "### arm64 vs x86_64"
              echo '```'
              sed -n '/divergences in/,$p' out-compare.txt
              echo '```'
            } | summary
          fi
        else
          # No second slice, so fall back to the interpreter. It answers a
          # weaker question and has its own false positives (see the README),
          # so divergences are reported but do not fail the job. A fatal error
          # still does - that is the class where a block cannot be encoded at
          # all, and it is worth catching however we got there.
          echo "cannot run both slices on this runner, falling back to the interpreter"

          echo "::group::interpreter ($native)"
          arch -"$native" "$BIN" \
            --seed "$JIT_DIFF_SEED" \
            --iterations "$JIT_DIFF_ITERATIONS" \
            --label "$native" \
            --interpreter \
            --signatures-out "sig-$native.txt" 2>&1 | tee out-interpreter.txt
          interp_rc=${PIPESTATUS[0]}
          echo "::endgroup::"

          {
            echo "Could not run both slices on this runner, so there is no"
            echo "cross-backend comparison. Fell back to checking $native against"
            echo "the interpreter, which reports but does not fail on divergences."
            echo
            echo '```'
            sed -n '/divergences in/,$p' out-interpreter.txt
            echo '```'
          } | summary

          if [ "$interp_rc" -ge 2 ]; then
            echo "::error::the $native recompiler logged a fatal error"
            status=1
          fi
        fi

        if [ "$status" != 0 ]; then
          {
            echo
            echo "A fatal error is the more serious outcome: a block the recompiler"
            echo "cannot encode leaves \`block->func\` null, and that core then makes"
            echo "no forward progress at all - it presents as a freeze, not as a"
            echo "wrong value."
          } | summary
        fi

        exit $status

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: jit-diff-macos
        path: |
          out-*.txt
          sig-*.txt
          jit-*.rec
        if-no-files-found: warn
