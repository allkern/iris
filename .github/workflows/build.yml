name: Build CI

on:
  push:
  pull_request:

jobs:
  windows-build:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Configure build for ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        cmake --build build
        New-Item -Path "dist" -ItemType Directory
        Copy-Item -Path ".\build\iris.exe" "dist"

    - uses: actions/upload-artifact@v7
      with:
        name: iris-latest-windows-${{ matrix.arch }}
        path: dist/

  linux-build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      CLANG_VERSION: 20

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install deps
      run: |
        sudo add-apt-repository -y universe
        sudo apt-get install -y git make \
        pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
        libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
        libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
        libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
        libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfuse2t64

    - name: Install clang ${{ env.CLANG_VERSION }}
      run: |
        if ! apt-cache show "clang-${CLANG_VERSION}" > /dev/null 2>&1; then
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CLANG_VERSION}"
        fi
        sudo apt-get install -y "clang-${CLANG_VERSION}"
        clang-${CLANG_VERSION} --version

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install mbedTLS codegen deps
      run: pip install -r deps/mbedtls/scripts/basic.requirements.txt

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-${CLANG_VERSION} \
          -DCMAKE_CXX_COMPILER=clang++-${CLANG_VERSION}
        cmake --build build
        sudo cmake --install build
        mkdir dist
        mv ./build/iris ./dist
        mkdir appimage
        mv ./build/*.AppImage ./appimage

    - uses: actions/upload-artifact@v7
      with:
        name: iris-latest-linux-${{ matrix.arch }}
        path: ./dist

    - uses: actions/upload-artifact@v7
      with:
        name: iris-latest-linux-${{ matrix.arch }}-appimage
        path: ./appimage

  macos-universal-build:
    name: macos-universal
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        optional_components: com.lunarg.vulkan.volk
        install_runtime: true
        cache: true
        stripdown: true

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install mbedTLS codegen deps
      run: pip install -r deps/mbedtls/scripts/basic.requirements.txt

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        sudo cmake --install build
        mkdir -p ./build/dist
        cp -R ./build/iris.app ./build/dist

    - uses: actions/upload-artifact@v7
      with:
        name: iris-latest-macos-universal
        path: ./build/dist
