name: Release CI

on:
  push:
    tags:
    - '0.*'

jobs:
  windows-build:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Configure build for ${{ matrix.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        cmake --build build
        New-Item -Path "dist" -ItemType Directory
        Copy-Item -Path ".\build\iris.exe" "dist"

    - name: Generate artifact name
      id: generate-name
      run: |
        "artifact=iris-${{ github.ref_name }}-windows-${{ matrix.arch }}" >> $env:GITHUB_OUTPUT

    - name: Zip artifact
      run: |
        $artifactName = "${{ steps.generate-name.outputs.artifact }}"
        Compress-Archive -Path "dist\*" -DestinationPath "$artifactName.zip"

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.generate-name.outputs.artifact }}.zip

  linux-build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    env:
      CLANG_VERSION: 20

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install deps
      run: |
        sudo add-apt-repository -y universe
        sudo apt-get install -y git make \
        pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
        libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
        libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
        libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
        libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libfuse2t64

    # The runner images ship clang 16-18 and #embed needs 19 or newer. Ubuntu's
    # own archive carries clang-20 on x86_64; fall back to apt.llvm.org when the
    # package is missing so the arm64 runner does not depend on that.
    - name: Install clang ${{ env.CLANG_VERSION }}
      run: |
        if ! apt-cache show "clang-${CLANG_VERSION}" > /dev/null 2>&1; then
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CLANG_VERSION}"
        fi
        sudo apt-get install -y "clang-${CLANG_VERSION}"
        clang-${CLANG_VERSION} --version

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install mbedTLS codegen deps
      run: pip install -r deps/mbedtls/scripts/basic.requirements.txt

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-${CLANG_VERSION} \
          -DCMAKE_CXX_COMPILER=clang++-${CLANG_VERSION}
        cmake --build build
        sudo cmake --install build
        mkdir dist
        mv ./build/iris ./dist
        mkdir appimage
        mv ./build/*.AppImage ./appimage

    - name: Generate artifact names
      id: generate-name
      run: |
        echo "artifact=iris-${{ github.ref_name }}-linux-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
        echo "appimage=iris-${{ github.ref_name }}-linux-${{ matrix.arch }}-appimage" >> "$GITHUB_OUTPUT"

    - name: Zip artifacts
      run: |
        zip -rj ${{ steps.generate-name.outputs.artifact }}.zip dist
        zip -rj ${{ steps.generate-name.outputs.appimage }}.zip appimage

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.generate-name.outputs.artifact }}.zip
          ${{ steps.generate-name.outputs.appimage }}.zip

  macos-universal-build:
    name: macos-universal
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        optional_components: com.lunarg.vulkan.volk
        install_runtime: true
        cache: true
        stripdown: true

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install mbedTLS codegen deps
      run: pip install -r deps/mbedtls/scripts/basic.requirements.txt

    - name: Build and pack Iris
      run: |
        git fetch --all --tags
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        sudo cmake --install build

    - name: Generate artifact name
      id: generate-name
      run: |
        echo "artifact=iris-${{ github.ref_name }}-macos-universal" >> "$GITHUB_OUTPUT"

    - name: Zip artifact
      run: |
        cd build; zip -r ../${{ steps.generate-name.outputs.artifact }}.zip ./iris.app; cd ..

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.generate-name.outputs.artifact }}.zip
